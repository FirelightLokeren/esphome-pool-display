################################################################################
#  Time Timer — ESPHome configuration
#  ESP32-S3 + ACT1026 32×32 RGB LED panel via BLE
#
#  Replace XX:XX:XX:XX:XX:XX with your panel's MAC address.
################################################################################

esphome:
  name: time-timer
  friendly_name: Time Timer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Time Timer Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: DEBUG

safe_mode:

# ── Time ──────────────────────────────────────────────────────────────────────

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Brussels

# ── BLE ───────────────────────────────────────────────────────────────────────

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 211ms
    window: 120ms

ble_client:
  - mac_address: "55:3D:EC:D7:10:0E"
    id: panel_ble
    on_connect:
      then:
        - logger.log: "BLE panel connected"
    on_disconnect:
      then:
        - logger.log: "BLE panel disconnected"

# ── Custom component ──────────────────────────────────────────────────────────

external_components:
  - source:
      type: local
      path: components

time_timer:
  id: timer
  ble_client_id: panel_ble
  time_id: ha_time
  brightness: 70
  clock_style: 1

# ── HA Input — timer duration ─────────────────────────────────────────────────
# Create a helper in HA: Settings → Devices & Services → Helpers → Number
# Name: "Timer Duration", min: 1, max: 3600, unit: seconds (or minutes)

# ── HA Entities ───────────────────────────────────────────────────────────────

number:
  - platform: template
    name: "Timer Hours"
    id: timer_hours
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 0
    optimistic: true
    mode: box
    unit_of_measurement: "h"

  - platform: template
    name: "Timer Minutes"
    id: timer_minutes
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 5
    optimistic: true
    mode: box
    unit_of_measurement: "min"

  - platform: template
    name: "Timer Brightness"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    set_action:
      - lambda: id(timer).send_brightness((uint8_t)x);

button:
  - platform: template
    name: "Start Timer"
    on_press:
      - lambda: |
          uint32_t secs = (uint32_t)(id(timer_hours).state * 3600)
                        + (uint32_t)(id(timer_minutes).state * 60);
          if (secs > 0) id(timer).start(secs);

  - platform: template
    name: "Stop Timer"
    on_press:
      - lambda: id(timer).stop();

  - platform: template
    name: "Show Clock"
    on_press:
      - lambda: id(timer).show_clock();

text_sensor:
  - platform: template
    name: "Timer Remaining Time"
    id: remaining_time_sensor
    update_interval: 1s
    lambda: |-
      uint32_t secs = id(timer).remaining_seconds();
      uint32_t h = secs / 3600;
      uint32_t m = (secs % 3600) / 60;
      uint32_t s = secs % 60;
      char buf[9];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", (int)h, (int)m, (int)s);
      return std::string(buf);

binary_sensor:
  - platform: template
    name: "Timer Running"
    lambda: return id(timer).is_running();

  - platform: template
    name: "Panel Connected"
    lambda: return id(timer).is_connected();

select:
  - platform: template
    name: "Clock Style"
    id: clock_style_select
    optimistic: true
    initial_option: "Style 1"
    options:
      - "Style 0"
      - "Style 1"
      - "Style 2"
      - "Style 3"
      - "Style 4"
      - "Style 5"
      - "Style 6"
      - "Style 7"
      - "Style 8"
    set_action:
      - lambda: |-
          uint8_t s = (uint8_t)atoi(x.substr(6).c_str());
          id(timer).set_clock_style(s);
          if (!id(timer).is_running()) id(timer).show_clock();

switch:
  - platform: template
    name: "Panel Power"
    optimistic: true
    turn_on_action:
      - lambda: id(timer).send_power(true);
    turn_off_action:
      - lambda: id(timer).send_power(false);

  - platform: template
    name: "Clock Show Date"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(timer).set_show_date(true);
    turn_off_action:
      - lambda: id(timer).set_show_date(false);

# ── Interval — re-sync clock when idle ────────────────────────────────────────

interval:
  - interval: 10min
    then:
      - if:
          condition:
            lambda: return id(timer).is_connected() && !id(timer).is_running();
          then:
            - lambda: id(timer).show_clock();
