substitutions:
  name: salt_level_sensor
  friendly_name: Water Softer Tank Level
  room_name: Kelder

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false 

esp8266:
  board: d1_mini_pro

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "YAhkl7FRBbtkALgdrsRCwhTUvWvMVYT1YhueYJEbce8="

ota:
  platform: esphome
  password: "359c87933b046e26c45fce68b05419e4"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Softy Fallback Hotspot"
    password: !secret ap_password

captive_portal:

web_server:

# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

# Text sensors with general information.
text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: salt_level_sensor ESPHome Version
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: salt_level_sensor IP
    ssid:
      name: salt_level_sensor SSID
    bssid:
      name: salt_level_sensor BSSID




# Exposed switches.
# Switch to restart the salt_level_sensor.   
switch:
  - platform: restart
    name: "salt_level_sensor Restart"

uart:
  tx_pin: D1
  rx_pin: D2
  baud_rate: 9600

sensor:
  - platform: a02yyuw
    name: "Salt Tank Distance"
    id: salt_distance
    filters:
     - filter_out: nan
     - throttle: 5s

  - platform: template
    name: "Salt Level"
    id: salt_level
    unit_of_measurement: "mm"
    lambda: |-
      float tank_height = 550.0; // Set the height of your water container in cm
      return (tank_height - id(salt_distance).state);
    update_interval: 5s

  - platform: template
    name: "Salt Level Category"
    id: salt_level_category
    icon: "mdi:water"
    lambda: |-
      float level = id(salt_level).state;
      if (level < 100.0) return 0;
      else if (level < 200.0) return 1;
      else if (level < 300.0) return 2;
      else if (level < 400.0) return 3;
      else if (level < 500.0) return 4;
      else return 5;
    update_interval: 5s



  # Uptime sensor.
  - platform: uptime
    name: salt_level_sensor Uptime

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: salt_level_sensor WiFi Signal
    update_interval: 60s
  

output:
  - platform: gpio
    pin: GPIO2
    id: internal_led

interval:
  - interval: 1s
    then:
      if:
        condition:
          wifi.connected:
        then:
 #         - switch.turn_on: GPIO2
        else:
 #         - switch.turn_off: GPIO2