esphome:
  name: pool-display
  friendly_name: Pool Display

esp32:
  board: esp32-poe
  variant: ESP32
  framework:
    type: arduino

captive_portal:

web_server:
  port: 80

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pool Display"
    password: "poolsetup"

esp32_ble_tracker:
  scan_parameters:
    continuous: true

ble_client:
  - mac_address: "0D:D0:1E:CD:2F:D2"  # ACT1025 pool display
    id: panel_ble
    on_connect:
      - lambda: ESP_LOGI("main", "BLE panel connected");
    on_disconnect:
      - lambda: ESP_LOGI("main", "BLE panel disconnected");

external_components:
  - source:
      type: local
      path: components

pool_display:
  id: display
  ble_client_id: panel_ble
  brightness: 70

# ── Sensor inputs from HA ──────────────────────────────────────────────────────
# These receive values pushed from Home Assistant via the API.
# Wire them up to your actual pool sensor entities in HA automations,
# or use homeassistant sensor platform to mirror HA entities directly.

sensor:
  - platform: homeassistant
    id: pool_temp
    entity_id: sensor.poolcontrol_pool_temp
    on_value:
      - lambda: id(display).set_temperature(x);

  - platform: homeassistant
    id: pool_ph
    entity_id: sensor.poolcontrol_ph
    on_value:
      - lambda: id(display).set_ph(x);

  - platform: homeassistant
    id: pool_orp
    entity_id: sensor.poolcontrol_orp
    on_value:
      - lambda: id(display).set_orp(x);

binary_sensor:
  - platform: template
    name: "Panel Connected"
    lambda: return id(display).is_connected();

  - platform: template
    name: "Display Rotated"
    lambda: return id(display).is_rotated();

button:
  - platform: template
    name: "Rotate 180°"
    on_press:
      - lambda: id(display).toggle_rotation();

switch:
  - platform: template
    name: "Panel Power"
    optimistic: true
    turn_on_action:
      - lambda: id(display).send_power(true);
    turn_off_action:
      - lambda: id(display).send_power(false);

number:
  - platform: template
    name: "Display Brightness"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    mode: slider
    set_action:
      - lambda: id(display).send_brightness((uint8_t)x);
