# Example configuration entry
pcf8574:
  - id: 'pcf8574_hub_out_1'  # for output channel 1-8
    address: 0x24

  - id: 'pcf8574_hub_out_2'  # for output channel 9-16
    address: 0x25

  - id: 'pcf8574_hub_in_2'  # for input channel 1-8
    address: 0x21

  - id: 'pcf8574_hub_in_1'  # for input channel 9-16
    address: 0x22

# Individual outputs
switch:
  - platform: gpio
    name: "out1"
    pin:
      pcf8574: pcf8574_hub_out_1
      # Use pin number 0
      number: 0
      # One of INPUT or OUTPUT
      mode: OUTPUT
      inverted: false

  - platform: gpio
    name: "out2"
    pin:
      pcf8574: pcf8574_hub_out_1
      # Use pin number 1
      number: 1
      # One of INPUT or OUTPUT
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "out3"
    pin:
      pcf8574: pcf8574_hub_out_1
      # Use pin number 2
      number: 2
      # One of INPUT or OUTPUT
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "out4"
