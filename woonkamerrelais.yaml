esphome:
  name: woonkamerrelais
  friendly_name: Woonkamerrelais

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  core: !include poolcontrol_files/core.yaml

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "2bz1og0GzsCGfw2SyW+ec7pALpRMiWBQQsdbTvY0HA0="

ota:
  - platform: esphome
    password: "75bfcc31e0e2529c3a05c3b7465ec0d7"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Woonkamerrelais Fallback Hotspot"
    password: "QsQXw9GvukvC"

captive_portal:
    
web_server:
  port: 80
  version: 3
  js_url: https://oi.esphome.io/v3/www.js
   
# Example configuration entry for ESP32
i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 3

