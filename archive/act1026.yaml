################################################################################
#  ACT1026 BLE LED Panel — ESPHome configuration
#  Board: ESP32-S3
#  Panel: 32×32 RGB LED matrix (ACT1026 / iPixel-compatible)
#
#  Replace MAC_ADDRESS_HERE with your panel's BLE MAC address.
#  You can find it with the nRF Connect app or by scanning in ESPHome logs.
################################################################################

esphome:
  name: act1026-panel
  friendly_name: LED Panel ACT1026
  platformio_options:
    # Needed for large BLE stack + custom component
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    # esp-idf is required for BLE client on S3
    version: recommended

# ── WiFi & HA API ─────────────────────────────────────────────────────────────

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ACT1026 Fallback"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: DEBUG

# ── Time source (sync clock to panel on connect) ─────────────────────────────

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Brussels

# ── BLE ───────────────────────────────────────────────────────────────────────

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 211ms
    window: 120ms

ble_client:
  - mac_address: "55:3D:EC:D7:10:0E"   # ← Replace with your panel MAC
    id: panel_ble
    on_connect:
      then:
        - logger.log: "BLE panel connected"
    on_disconnect:
      then:
        - logger.log: "BLE panel disconnected — will reconnect"

# ── Custom component ──────────────────────────────────────────────────────────

external_components:
  - source:
      type: local
      path: components   # folder containing act1026/__init__.py + act1026.h

act1026:
  id: panel
  ble_client_id: panel_ble
  time_id: ha_time
  brightness: 70          # 0–100
  clock_style: 1          # 0–8, see docs
  auto_sync_time: true    # send time+clock mode right after connect

# ── HA-exposed controls ───────────────────────────────────────────────────────

number:
  - platform: template
    name: "Panel Brightness"
    id: panel_brightness
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    set_action:
      - lambda: |-
          id(panel).send_brightness((uint8_t)x);

select:
  - platform: template
    name: "Panel Clock Style"
    id: panel_clock_style
    options:
      - "Style 0"
      - "Style 1"
      - "Style 2"
      - "Style 3"
      - "Style 4"
      - "Style 5"
      - "Style 6"
      - "Style 7"
      - "Style 8"
    initial_option: "Style 1"
    optimistic: true
    set_action:
      - lambda: |-
          int style = 0;
          for (int i = 0; i <= 8; i++) {
            if (x == ("Style " + std::to_string(i))) { style = i; break; }
          }
          id(panel).send_clock_mode((uint8_t)style);

switch:
  - platform: template
    name: "Panel Power"
    id: panel_power
    optimistic: true
    turn_on_action:
      - lambda: id(panel).send_power(true);
    turn_off_action:
      - lambda: id(panel).send_power(false);

# ── Automations ───────────────────────────────────────────────────────────────

interval:
  # Re-sync time every 10 minutes while connected
  - interval: 10min
    then:
      - if:
          condition:
            lambda: return id(panel).is_connected();
          then:
            - lambda: id(panel).send_clock_mode();

button:
  - platform: template
    name: "Panel Show Clock"
    on_press:
      - lambda: id(panel).send_clock_mode();

  - platform: template
    name: "Panel Solid Red"
    on_press:
      - lambda: id(panel).send_solid_color(255, 0, 0);

  - platform: template
    name: "Panel Solid Green"
    on_press:
      - lambda: id(panel).send_solid_color(0, 200, 0);

  - platform: template
    name: "Panel Solid Blue"
    on_press:
      - lambda: id(panel).send_solid_color(0, 0, 255);

  - platform: template
    name: "Panel Off (black)"
    on_press:
      - lambda: id(panel).send_solid_color(0, 0, 0);

binary_sensor:
  - platform: template
    name: "Panel Connected"
    lambda: return id(panel).is_connected();
