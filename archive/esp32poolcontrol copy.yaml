esphome:
  name: "esp32poolcontrol"
  friendly_name: "esp32poolcontrol"
substitutions:
  name: "esp32poolcontrol"
  friendly_name: "esp32poolcontrol"
  debounce_time: "100ms"
esp32:
  board: esp32dev
  framework:
    type: arduino
packages:
  core: !include poolcontrol_files/core.yaml
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Dingtian Fallback Hotspot"
    password: !secret ap_password
captive_portal:
external_components:
  - source: github://kecajtop/dtr0xx_io@master
    refresh: 60s
    components:
      - dtr0xx_io
# Enable logging
logger:
  level: DEBUG
  baud_rate: 0
# Enable Home Assistant API
api:
  encryption:
    key: "lqrE7D+1nCX/YDep0S34Pa3KPMKNeS6+iMx3KuzMPmw="
ota:
  - platform: esphome
    password: "2494bd7a1d2db33431a15e569937e31d"
web_server:
  port: 80
  version: 3
  js_url: https://oi.esphome.io/v3/www.js
time:
  - platform: sntp
    id: my_time
i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 400kHz
one_wire:
  - platform: gpio
    id: sensor_bus
    pin: 33
uart:
  id: mod_bus
  tx_pin: 1
  rx_pin: 3
  baud_rate: 9600
  stop_bits: 1
dtr0xx_io:
  - id: dtr0xx_io_hub
    dingtian_clk_pin: 14
    dingtian_q7_pin: 16
    dingtian_sdi_pin: 13
    dingtian_pl_pin: 32
    dingtian_rck_pin: 15
binary_sensor:
  - platform: gpio                          # INPUT 1
    id: input_roof
    name: Roof
    icon: "mdi:home-roof"
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 7
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: $debounce_time
      - delayed_off: $debounce_time
    internal: true
  - platform: gpio                          # INPUT 2
    name: Pool
    id: input_pool
    icon: "mdi:pool"
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 6
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: $debounce_time
      - delayed_off: $debounce_time
    internal: true
  - platform: gpio                          # INPUT 3
    name: water level high
    id: input_water_level_high
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 5
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: $debounce_time
      - delayed_off: $debounce_time
    internal: true
  - platform: gpio                          # INPUT 4
    name: water level normal
    id: input_water_level_normal
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 4
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: $debounce_time
      - delayed_off: $debounce_time
    internal: true
  - platform: gpio                          # INPUT 5
    name: water level low
    id: input_water_level_low
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 3
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: $debounce_time
      - delayed_off: $debounce_time
    internal: true
  - platform: gpio                          # INPUT 6
    name: ${friendly_name} Input 6
    id: input_6
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 2
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: $debounce_time
      - delayed_off: $debounce_time
    internal: true
  - platform: gpio                          # INPUT 7
    name: ${friendly_name} Input 7
    id: input_7
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 1
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: $debounce_time
      - delayed_off: $debounce_time
    internal: true
  - platform: gpio                          # INPUT 8
    name: ${friendly_name} Input 8
    id: input_8
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 0
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: $debounce_time
      - delayed_off: $debounce_time
    internal: true
  - platform: template                      # SWITCH BYPASS RELAY delta temp
    id: delta_temp_trigger
    name: "Delta Temp Trigger"
    lambda: |-
      if (id(delta_temp).state > 5.0) {
        return true;
      } else if (id(delta_temp).state < 1.0) {
        return false;
      } else {
        return id(delta_temp_trigger).state;
      }
    on_press:
      - switch.turn_on: relay_bypass
    on_release:
      - switch.turn_off: relay_bypass
    internal: True


switch:
  - platform: gpio                          # RELAY 1
    name: ${friendly_name} Relay 1
    id: relay_1
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 7
      inverted: false
      allow_other_uses: true
    internal: True
  - platform: gpio                          # RELAY 2
    name: Pump off
    id: relay_pump_off
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: [relay_pump_low, relay_pump_med, relay_pump_high]
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 6
      inverted: true
      allow_other_uses: true
    internal: True
  - platform: gpio                          # RELAY 3
    name: Pump low
    id: relay_pump_low
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: [relay_pump_off, relay_pump_med, relay_pump_high]
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 5
      inverted: false
      allow_other_uses: true
    internal: True
  - platform: gpio                          # RELAY 4
    name: Pump med
    id: relay_pump_med
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: [relay_pump_off, relay_pump_low, relay_pump_high]
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 4
      inverted: false
      allow_other_uses: true
    internal: True
  - platform: gpio                          # RELAY 5
    name: Pump high
    id: relay_pump_high
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: [relay_pump_off, relay_pump_low, relay_pump_med]
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 3
      inverted: false
      allow_other_uses: true
    internal: True
  - platform: gpio    # RELAY 6
    name: ${friendly_name} Relay 6
    id: relay_6
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 2
      inverted: false
      allow_other_uses: true
    internal: True
  - platform: gpio    # RELAY 7
    name: Bypass dak
    id: relay_bypass
    restore_mode: RESTORE_DEFAULT_OFF
    #interlock: [relay_8]
    #interlock_wait_time: 250ms
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 1
      inverted: false
      allow_other_uses: true
    internal: True
  - platform: gpio    # RELAY 8
    name: ${friendly_name} Relay 8
    id: relay_8
    restore_mode: RESTORE_DEFAULT_OFF
    #interlock: [relay_7]
    #interlock_wait_time: 250ms
    pin:
      dtr0xx_io: dtr0xx_io_hub
      number: 0
      inverted: false
      allow_other_uses: true
    internal: True
sensor:     
  - platform: ezo                           # READ pH
    id: ph_ezo
    name: "pH"
    address: 99
    accuracy_decimals: 2
    unit_of_measurement: "pH"
    state_class: "measurement"
    update_interval: 15s
    internal: true
  - platform: ezo                           # READ ORP
    id: orp_ezo
    name: "ORP"
    address: 98
    accuracy_decimals: 1
    unit_of_measurement: "mV"
    state_class: "measurement"
    update_interval: 15s
    internal: true
  - platform: ezo                           # READ ROOF TEMP
    id: rtd_ezo_roof
    name: "Roof temp"
    icon: "mdi:sun-thermometer-outline"
    address: 102
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    state_class: "measurement"
    update_interval: 15s
    internal: false
    web_server:
      sorting_weight: 20
  - platform: ezo                           # READ POOL TEMP
    id: rtd_ezo_pool
    name: "pool temp"
    icon: "mdi:pool-thermometer"
    address: 103
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    state_class: "measurement"
    update_interval: 15s
    internal: false
    web_server:
      sorting_weight: 30
  - platform: ezo                           # READ PUMP FLOW
    id: flow_ezo
    name: "Pump flow"
    address: 104
    accuracy_decimals: 1
    unit_of_measurement: "L/min"
    state_class: "measurement"
    update_interval: 15s
    internal: true
    web_server:
      sorting_weight: 75
  - platform: template                      # CALC DELTA TEMP
    id: delta_temp
    name: "Delta temperature"
    unit_of_measurement: "°C"
    update_interval: 10s
    icon: mdi:delta
    lambda: 'return id(rtd_ezo_roof).state - id(rtd_ezo_pool).state;'
    internal: false
    web_server:
      sorting_weight: 40
  - platform: homeassistant                 # READ OMGEVINGS TEMP FROM HA
    name: "BLE Pool Temperature"
    entity_id: sensor.proxy_ble_pool_temperature
    id: proxy_ble_pool_temperature
  - platform: template                      # DISPLAY OMGEVINS TEMP
    name: "Omgeving"
    id: ble_pool_temp_template
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: mdi:home-thermometer
    update_interval: 10s
    lambda: |-
      return id(proxy_ble_pool_temperature).state;
    internal: false
    web_server:
      sorting_weight: 10
text_sensor:
  - platform: template                      # DISPLAY STATUS 3-WEG KLEP
    name: "3-Way Valve Mode"
    id: valve_mode
    lambda: |-
      if (id(input_roof).state) {
        return std::string("Roof");
      } else if (id(input_pool).state) {
        return std::string("Pool");
      } else {
        return std::string("Moving");
      }
    icon: mdi:valve
    web_server:
      sorting_weight: 50

  - platform: homeassistant
    id: heatpump_mode_status
    entity_id: climate.w_eau_pool_heatpump
    attribute: hvac_mode  # or "hvac_mode" depending on what you're trying to mirror
    internal: false

  - platform: homeassistant
    id: heatpump_preset_status
    entity_id: climate.w_eau_pool_heatpump
    attribute: preset_mode
    internal: false

select:
  - platform: template                      # SET PUMP SPEED
    id: pump_speed
    name: "Pump speed"
    optimistic: true
    options:
      - "off"
      - "low"
      - "med"
      - "high"
    initial_option: low
    icon: mdi:pump
    set_action:
      - lambda: |-
          // Turn all relays off first
          id(relay_pump_off).turn_off();
          id(relay_pump_low).turn_off();
          id(relay_pump_med).turn_off();
          id(relay_pump_high).turn_off();

          // Turn on only the selected one
          if (x == "off") {
            id(relay_pump_off).turn_on();
          } else if (x == "low") {
            id(relay_pump_low).turn_on();
          } else if (x == "med") {
            id(relay_pump_med).turn_on();
          } else if (x == "high") {
            id(relay_pump_high).turn_on();
          }
    web_server:
      sorting_weight: 70
  
  - platform: template
    id: local_heatpump_mode
    name: "Heat Pump Mode"
    options:
      - "heat_cool"
      - "heat"
      - "cool"
      - "off"
    initial_option: "off"
    icon: mdi:thermostat
    set_action:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: climate.w_eau_pool_heatpump
            hvac_mode: !lambda 'return x;'



  - platform: template
    id: local_heatpump_preset
    name: "Heat Pump Preset"
    options:
      - "quick_heat"
      - "quiet_heat"
      - "quiet_cool"
      - "auto"
    initial_option: "quick_heat"
    icon: mdi:thermostat
    set_action:
      - homeassistant.service:
          service: climate.set_preset_mode
          data:
            entity_id: climate.w_eau_pool_heatpump
            preset_mode: !lambda 'return x;'

interval:
  - interval: 2s
    then:
      - lambda: |-                          # SET PUMP TO LOW SPEED IF DELTA TEMP > 10° AND PUMP IS OFF
          if (id(delta_temp).state > 10.0 && id(pump_speed).state == "off") {
            id(relay_pump_low).turn_on();
          }
      - lambda: |-                          # SET PUMP TO LOW SPEED IF OMGEVING TEMP < 10° AND PUMP SPEED IS MED OF HIGH
          if (id(ble_pool_temp_template).state < 10.0 && 
              (id(pump_speed).state == "med" || id(pump_speed).state == "high")) {
            id(relay_pump_low).turn_on();
          }
      - lambda: |-                          # SET PUMP TO MED SPEED WHEN OMGEVING TEMP IS > 15° AND PUMP SPEED IS OFF OR MED
          if (id(ble_pool_temp_template).state > 15.0 &&
              (id(pump_speed).state == "low" || id(pump_speed).state == "off")) {
            id(relay_pump_med).turn_on();
          }
      - lambda: |-                          # SET CURRENT SPEED ACORDING TO THE RELAY THAT IS ON           
          std::string current_speed;
          if (id(relay_pump_off).state) {
            current_speed = "off";
          } else if (id(relay_pump_low).state) {
            current_speed = "low";
          } else if (id(relay_pump_med).state) {
            current_speed = "med";
          } else if (id(relay_pump_high).state) {
            current_speed = "high";
          }
          if (current_speed != id(last_pump_speed)) {
            id(last_pump_speed) = current_speed;
            id(pump_speed).publish_state(current_speed);
          }

  - interval: 10s
    then:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.w_eau_pool_heatpump
          data_template:
            temperature: !lambda 'return id(local_heatpump_target_temp).state;'



 

  - interval: 10s
    then:
      - lambda: |-                       # UPDATE HEATPUMP STATUS WITH VALUES FROM HA 
          id(local_heatpump_mode).publish_state(id(heatpump_mode_status).state);
          id(local_heatpump_preset).publish_state(id(heatpump_preset_status).state);

number:
  - platform: template                      # INPUT SLIDER ON DASHBOARD FOR TARGET TEMP
    name: "Heat Pump Target Temp"
    id: local_heatpump_target_temp
    min_value: 20
    max_value: 35
    step: 1
    initial_value: 28
    optimistic: true
    web_server:
      sorting_weight: 71
globals:
  - id: last_pump_speed                     # LAST PUMP SPEED SEND TO HA
    type: std::string
    initial_value: "\"\""
