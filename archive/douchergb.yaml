esphome:
  name: ${esphome_name}
  platformio_options:
    board_build.flash_mode: dio


esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

#Disable logging/UART
logger:
#  level: NONE
  baud_rate: 0

# Enable Home Assistant API
api:
  reboot_timeout: 60min
  encryption:
    key: "fxxKqry6Ibljs3PixsfWDY3tUIXOPtAx0WylpGshsD0="

ota:
  - platform: esphome
    password: "95efe4c4750a84f03f8456ce9be63789"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Douchergb Fallback Hotspot"
    password: !secret ap_password

captive_portal:

substitutions:
  esphome_name: douchergb

time:
  - platform: homeassistant
    id: homeassistant_time

web_server:
  port: 80

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true
  id: I2C

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 3


sensor:
  - platform: uptime
    name: "${esphome_name} Uptime Sensor"
    
  - platform: wifi_signal
    name: "${esphome_name} WiFi Signal"
    update_interval: 60s

  - platform: internal_temperature
    name: "${esphome_name} Internal Temperature"
    accuracy_decimals: 2
    update_interval: 30s

switch:
  - platform: restart
    name: ${esphome_name}-restart
    id: restart_switch

output:
  - platform: ledc
    pin: GPIO5
    frequency: 19531Hz
    id: LED_channel_1

  - platform: ledc
    pin: GPIO4
    frequency: 19531Hz
    id: LED_channel_2

  - platform: ledc
    pin: GPIO1
    frequency: 19531Hz
    id: LED_channel_3

  - platform: ledc
    pin: GPIO0
    frequency: 19531Hz
    id: LED_channel_4

  - platform: ledc
    pin: GPIO3
    frequency: 19531Hz
    id: LED_channel_5

light:
#  - platform: rgbww
#    id: "${esphome_name}"
#    name: "${esphome_name}"
#    default_transition_length: 0s
#    warm_white: LED_channel_1
#    cold_white: LED_channel_2
#    blue: LED_channel_3
#    green: LED_channel_4
#    red: LED_channel_5

  - platform: rgbw
    id: "${esphome_name}"
    name: "${esphome_name}"
    default_transition_length: 0s
    white: LED_channel_2
    blue: LED_channel_3
    green: LED_channel_4
    red: LED_channel_5



    effects:
      - random:
          name: "My Fast Random Effect"
          transition_length: 4s
          update_interval: 5s
      - strobe:

      - lambda:
          name: Slow Rainbow
          update_interval: 16s
          lambda: |-
            static int state = 0;
            auto call = id(${esphome_name}).turn_on();
            call.set_transition_length(15000);
            if (state == 0) {
              call.set_rgbw(1.0, 0.0, 0.0, 0.0);
            } else if (state == 1) {
              call.set_rgbw(1.0, 0.5, 0.0, 0.0);
            } else if (state == 2) {
              call.set_rgbw(1.0, 1.0, 0.0, 0.0);
            } else if (state == 3) {
              call.set_rgbw(0.5, 1.0, 0.0, 0.0);
            } else if (state == 4) {
              call.set_rgbw(0.0, 1.0, 0.0, 0.0);
            } else if (state == 5) {
              call.set_rgbw(0.0, 1.0, 0.5, 0.0);
            } else if (state == 6) {
              call.set_rgbw(0.0, 1.0, 1.0, 0.0);
            } else if (state == 7) {
              call.set_rgbw(0.0, 0.5, 1.0, 0.0);
            } else if (state == 8) {
              call.set_rgbw(0.0, 0.0, 1.0, 0.0);
            } else if (state == 9) {
              call.set_rgbw(0.5, 0.0, 1.0, 0.0);
            } else if (state == 10) {
              call.set_rgbw(1.0, 0.0, 1.0, 0.0);
            } else if (state == 11) {
              call.set_rgbw(1.0, 0.0, 0.5, 0.0);
            }
            call.perform();
            state++;
            if (state == 12)
              state = 0;


      
# Text sensors with general information.
text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: douchergb ESPHome Version
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: douchergb IP
    ssid:
      name: douchergb SSID
    bssid:
      name: douchergb BSSID
