##############################################################################
# 1-second interval – alleen countdown, GEEN BLE frame versturen
##############################################################################
interval:
  - interval: 1s
    then:
      # Countdown logic (blijft werken)
      - lambda: |-
          if (id(g_state) == 1) {  // RUNNING
            if (id(g_remain_sec) > 0) {
              id(g_remain_sec)--;
            }
            if (id(g_remain_sec) == 0) {
              id(g_state) = 3;  // DONE
            }
          }

      # BLE frame versturen uitgecommentarieerd
      # - if:
      #     condition:
      #       lambda: 'return id(g_ble_ready);'
      #     then:
      #       - ble_client.ble_write: ... (alles BLE uit)

##############################################################################
# Home Assistant Entities
##############################################################################
sensor:
  - platform: template
    name: "Timer Remaining"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return (float)id(g_remain_sec);'
    icon: mdi:timer-outline

text_sensor:
  - platform: template
    name: "Timer State"
    update_interval: 1s
    lambda: |-
      switch (id(g_state)) {
        case 0: return "IDLE";
        case 1: return "RUNNING";
        case 2: return "PAUSED";
        case 3: return "DONE";
        default: return "UNKNOWN";
      }
    icon: mdi:timer

  # Panel Connected sensor uitgecommentarieerd
  # - platform: template
  #   name: "Panel Connected"
  #   update_interval: 5s
  #   lambda: 'return id(g_ble_ready) ? "Yes" : "No";'
  #   icon: mdi:bluetooth-connect

number:
  - platform: template
    name: "Timer Minutes"
    min_value: 1
    max_value: 99
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    icon: mdi:timer-sand
    set_action:
      - lambda: |-
          id(g_total_sec) = (int)(x * 60);
          id(g_remain_sec) = id(g_total_sec);
          id(g_state) = 0;

  # Brightness via HA uitgecommentarieerd (kan later weer aan als BLE terugkomt)
  # - platform: template
  #   name: "Panel Brightness"
  #   ...

button:
  - platform: template
    name: "Timer Start / Pause / Reset"
    icon: mdi:play-pause
    on_press:
      - lambda: |-
          switch (id(g_state)) {
            case 0:
              if (id(g_remain_sec) > 0) id(g_state) = 1;
              break;
            case 1: id(g_state) = 2; break;
            case 2: id(g_state) = 1; break;
            case 3:
              id(g_remain_sec) = id(g_total_sec);
              id(g_state) = 0;
              break;
          }

  - platform: template
    name: "Timer Reset"
    icon: mdi:timer-refresh
    on_press:
      - lambda: |-
          id(g_remain_sec) = id(g_total_sec);
          id(g_state) = 0;

##############################################################################
# Physical Buttons (blijven werken)
##############################################################################
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Btn Set Plus"
    internal: true
    filters: [delayed_on: 50ms]
    on_press:
      - lambda: |-
          if (id(g_state) != 1) {
            id(g_total_sec) = std::min(id(g_total_sec) + 60, 99*60);
            id(g_remain_sec) = id(g_total_sec);
            id(g_state) = 0;
          }

  - platform: gpio
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
      inverted: true
    name: "Btn Set Minus"
    internal: true
    filters: [delayed_on: 50ms]
    on_press:
      - lambda: |-
          if (id(g_state) != 1 && id(g_total_sec) >= 60) {
            id(g_total_sec) -= 60;
            id(g_remain_sec) = id(g_total_sec);
            id(g_state) = 0;
          }

  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    name: "Btn Start/Pause"
    internal: true
    filters: [delayed_on: 50ms]
    on_press:
      - lambda: |-
          switch (id(g_state)) {
            case 0:
              if (id(g_remain_sec) > 0) id(g_state) = 1;
              break;
            case 1: id(g_state) = 2; break;
            case 2: id(g_state) = 1; break;
            case 3:
              id(g_remain_sec) = id(g_total_sec);
              id(g_state) = 0;
              break;
          }