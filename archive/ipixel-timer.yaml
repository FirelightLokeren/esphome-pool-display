##############################################################################
#  iPixel Timer – ESP32-S3 + ACT1026 32×32 BLE LED Matrix
#  Versie zonder actieve Bluetooth (alles BLE is uitgecommentarieerd)
##############################################################################

substitutions:
  device_name: ipixel-timer
  friendly_name: iPixel Timer

  # GATT UUIDs (uitgecommentarieerd omdat BLE uit staat)
  # svc_uuid:    "0000ae00-0000-1000-8000-00805f9b34fb"
  # write_uuid:  "0000ae01-0000-1000-8000-00805f9b34fb"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGI("timer", "Boot complete - Bluetooth is disabled");

external_components:
  - source:
      type: local
      path: components
    components: [timer_renderer]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

##############################################################################
# Custom Renderer Component (blijft actief voor toekomstig gebruik)
##############################################################################
timer_renderer:
  id: renderer

##############################################################################
# Globals
##############################################################################
globals:
  - id: g_total_sec
    type: int
    restore_value: yes
    initial_value: '300'

  - id: g_remain_sec
    type: int
    restore_value: no
    initial_value: '300'

  - id: g_state          # 0=IDLE, 1=RUNNING, 2=PAUSED, 3=DONE
    type: int
    restore_value: no
    initial_value: '0'

  - id: g_seq
    type: int
    restore_value: no
    initial_value: '0'

  - id: g_brightness
    type: int
    restore_value: yes
    initial_value: '60'

  # Bluetooth gerelateerde globals uitgecommentarieerd
  # - id: g_ble_ready
  #   type: bool
  #   restore_value: no
  #   initial_value: 'false'

  # - id: g_ble_connecting
